syntax = "proto3";

package temperature;

service TemperatureService {
  rpc GetTemperatureByLocation (GetTemperatureRequest) returns (GetTemperatureResponse);
  rpc CreateTemperatureSensor (CreateTemperatureSensorRequest) returns (CreateTemperatureSensorResponse);
}

message GetTemperatureRequest {
  string location = 1;
  int64 sensor_id = 2;
}

message GetTemperatureResponse {
  double temperature = 1;
}

message CreateTemperatureSensorRequest {
  int64 house_id = 1;
  string serial_number = 2;
  string model = 3;
  string status = 4;
  bool is_active = 5;
  double battery_level = 6;
  string room_label = 7;
}

message CreateTemperatureSensorResponse {
  int64 sensor_id = 1;
}
